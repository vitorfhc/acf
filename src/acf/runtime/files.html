<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><button type="button" class="icon-button mobile-toggle" id="menu-toggle" aria-label="Show folders" aria-controls="sidebar" aria-expanded="false"></button><span class="brand-mark" id="brand-icon"></span>Files <small>ACF filesystem</small></div>
    <button type="button" class="button primary" id="upload-open" disabled aria-haspopup="dialog" aria-controls="upload-dialog">Upload files</button>
  </header>
  <button type="button" class="overlay" id="overlay" aria-label="Hide folders" tabindex="-1"></button>
  <aside class="sidebar" id="sidebar" aria-label="Folder navigation">
    <p class="section-label">Quick access</p>
    <nav class="shortcuts" id="shortcuts" aria-label="Quick access"></nav>
    <p class="section-label">Filesystem</p>
    <nav aria-label="Folders"><ul class="tree" id="tree"></ul></nav>
  </aside>
  <main class="workspace" id="main">
    <div class="pathbar"><button type="button" class="icon-button" id="up" aria-label="Parent folder" title="Parent folder"></button><nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav><button type="button" class="icon-button" id="refresh" aria-label="Refresh" title="Refresh" style="margin-left:auto"></button></div>
    <div class="content" id="content" aria-busy="true"></div>
    <footer class="footer"><span class="footer-path" id="footer-path">/</span><span id="footer-status">Loading…</span></footer>
  </main>
</div>
<dialog class="upload-dialog" id="upload-dialog" aria-labelledby="upload-title" aria-describedby="upload-intro">
  <form id="upload-form">
    <h2 id="upload-title">Upload files</h2>
    <p class="upload-intro" id="upload-intro">Choose files and check their destination before uploading.</p>
    <label class="upload-field" for="upload-file">Files<input type="file" id="upload-file" multiple required></label>
    <div class="upload-queue" id="upload-queue" aria-label="Selected files" hidden></div>
    <label class="upload-option" for="upload-downloads"><input type="checkbox" id="upload-downloads"><span id="upload-downloads-label">Use Home Downloads (/root/Downloads)</span></label>
    <div class="upload-destination"><span>Upload destination</span><output id="upload-destination" aria-live="polite"></output></div>
    <p class="upload-note" id="upload-note">Existing files will not be overwritten.</p>
    <div class="notice upload-error" id="upload-error" role="alert" hidden></div>
    <div class="upload-progress" id="upload-progress" role="status" hidden><span class="spinner" aria-hidden="true"></span><span id="upload-progress-text">Uploading…</span></div>
    <div class="actions"><button type="button" id="upload-cancel">Cancel</button><button type="submit" class="primary" id="upload-submit" disabled>Upload files</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/assets/markdown-it.min.js"></script>
<script>

const $=id=>document.getElementById(id);

function breadcrumbs(path){const target=$('breadcrumbs');target.replaceChildren();const root=link('/','');root.append(icon('box'));root.setAttribute('aria-label','Filesystem root');target.append(root);const parts=path.split('/').filter(Boolean);let sofar='';parts.forEach((part,index)=>{sofar+='/'+part;target.append(element('span','separator','/'));const a=link(sofar,part);if(index===parts.length-1)a.setAttribute('aria-current','page');target.append(a);});if(!parts.length){root.setAttribute('aria-current','page');target.append(element('span','','Filesystem'));}target.scrollLeft=target.scrollWidth;}

async function renderDirectory(path,info,version){const result=await api('list',path,{offset:0,limit:250});if(version!==generation)return;const content=$('content'),header=heading(path,path==='/'?'All folders and files in this environment':path);content.replaceChildren(header);const table=element('table','listing'),thead=element('thead'),hrow=element('tr'),tbody=element('tbody');for(const label of ['Name','Kind','Size','Modified','']){const th=element('th','',label);th.scope='col';if(!label)th.append(element('span','visually-hidden','Actions'));hrow.append(th);}thead.append(hrow);table.append(thead,tbody);let count=0;const more=element('button','load-more','Load more'),note=element('div','notice warning','This directory is very large. The list is limited to 10,000 entries.');more.type='button';let next=result.next_offset;function append(data){data.entries.forEach(entry=>renderRow(entry,tbody));count+=data.entries.length;next=data.next_offset;more.hidden=next===null||next===undefined;note.hidden=!data.truncated;$('footer-status').textContent=count+' '+(count===1?'item':'items')+(more.hidden?'':' shown');}if(result.entries.length){content.append(note,table,more);append(result);}else{content.append(emptyState('This folder is empty','Choose another folder in the sidebar or go up one level.'));$('footer-status').textContent='0 items';}more.addEventListener('click',async()=>{more.disabled=true;more.textContent='Loading…';try{const page=await api('list',path,{offset:next,limit:250});if(version===generation)append(page);}catch(error){showToast(error.message,true);}finally{more.disabled=false;more.textContent='Load more';}});}
async function copyContents(path,button){button.disabled=true;const original=button.lastChild;const previous=original.textContent;original.textContent='Copying…';try{const url=new URL(BASE+'/api/text',location.origin);url.searchParams.set('path',path);const response=await fetch(url,{credentials:'same-origin',cache:'no-store'});if(!response.ok){let message='Could not copy this file.';try{message=(await response.json()).error||message;}catch{}throw new Error(message);}const content=(await response.json()).text;let copied=false;if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(content);copied=true;}catch{}}if(!copied){const area=element('textarea');area.value=content;area.setAttribute('readonly','');area.style.cssText='position:fixed;top:0;left:-9999px;opacity:0';document.body.append(area);area.select();area.setSelectionRange(0,content.length);copied=document.execCommand('copy');area.remove();button.focus();}if(!copied)throw new Error('Clipboard access failed. Select the preview text to copy, or download the file.');showToast('File contents copied.');}catch(error){showToast(error.message,true);}finally{button.disabled=false;original.textContent=previous;}}
function renderShortcuts(){
  $('shortcuts').replaceChildren();

function updateUploadAvailability(){
  $('upload-open').disabled=!fileSettings||!activeDirectory||uploadBusy;
  $('upload-open').title=!fileSettings?'Upload settings are unavailable. Refresh to retry.':!activeDirectory?'Open a folder or file to choose an upload destination':'Upload a file to this folder';
}
async function loadFileSettings(){
  try{
    const settings=await api('config','/');
    if(typeof settings.home!=='string'||!settings.home.startsWith('/')||typeof settings.downloads!=='string'||!settings.downloads.startsWith('/'))throw new Error('Invalid upload settings');
    fileSettings=settings;renderShortcuts();
  }catch(error){fileSettings=null;showToast('Uploads unavailable: '+error.message,true);}
  updateUploadAvailability();
}
function uploadDestination(){return uploadTarget||($('upload-downloads').checked?fileSettings.downloads:uploadDirectory);}
function updateUploadDestination(){
  const completed=uploadItems.filter(item=>item.state==='uploaded').length;
  const remaining=uploadItems.length-completed;
  $('upload-destination').textContent=uploadDestination();
  $('upload-file').disabled=uploadBusy||completed>0;
  $('upload-downloads').disabled=uploadBusy||completed>0;
  $('upload-cancel').disabled=uploadBusy;
  $('upload-cancel').textContent=completed?'Done':'Cancel';
  $('upload-submit').disabled=uploadBusy||remaining===0;
  $('upload-submit').textContent=uploadBusy?'Uploading…':uploadAttempted?'Retry remaining ('+remaining+')':remaining===1?'Upload file':remaining>1?'Upload '+remaining+' files':'Upload files';
  for(const item of uploadItems)item.nameInput.disabled=uploadBusy||item.state==='uploaded';
  $('upload-note').textContent=completed?'Uploaded files stay in this destination. Retry remaining files, or choose Done to start a new batch.':'Files upload one at a time. Existing files will not be overwritten.';
}
function setUploadItemState(item,state,message){

  const queue=$('upload-queue');queue.replaceChildren();

function openUpload(){
  if(!fileSettings||!activeDirectory||uploadBusy)return;
  uploadDirectory=activeDirectory;uploadItems=[];uploadTarget=null;uploadAttempted=false;
  $('upload-file').value='';$('upload-downloads').checked=false;$('upload-queue').replaceChildren();$('upload-queue').hidden=true;

function closeUpload(refresh=true){
  if(uploadBusy)return;
  $('upload-dialog').close();$('upload-open').focus();
  if(refresh&&uploadItems.some(item=>item.state==='uploaded'))navigate(uploadDestination());

async function submitUpload(event){
  event.preventDefault();if(uploadBusy)return;
  const pending=uploadItems.filter(item=>item.state!=='uploaded'),destination=uploadDestination();
  const errorBox=$('upload-error');errorBox.hidden=true;
  if(!pending.length){errorBox.textContent='Choose files to upload.';errorBox.hidden=false;return;}
  uploadAttempted=true;setUploadBusy(true);
  try{
    for(let index=0;index<pending.length;index++){
      const item=pending[index],name=item.nameInput.value;
      $('upload-progress-text').textContent='Uploading '+(index+1)+' of '+pending.length+'…';
      try{
        if(!name||name==='.'||name==='..'||/[\u0000/\\]/.test(name))throw new Error('Enter a file name without folders or slashes.');
        setUploadItemState(item,'uploading','Uploading…');
        const url=new URL(BASE+'/api/upload',location.origin);url.searchParams.set('path',destination);url.searchParams.set('name',name);
        const response=await fetch(url,{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/octet-stream','X-ACF-Upload':'1'},body:item.file});
        let result;try{result=await response.json();}catch{throw new Error('Upload response unavailable. Check the destination folder before retrying.');}
        if(!response.ok)throw new Error(result.error||'Upload failed ('+response.status+').');

      }catch(error){setUploadItemState(item,'failed',error.message);}
    }
    const completed=uploadItems.filter(item=>item.state==='uploaded').length;
    if(completed===uploadItems.length){
      setUploadBusy(false);closeUpload(false);await navigate(destination);
      showToast(completed===1?'Uploaded to '+uploadItems[0].savedPath:'Uploaded '+completed+' files to '+destination);
    }else{
      errorBox.textContent=completed+' of '+uploadItems.length+' files uploaded. Review the errors below each file, rename if needed, and retry remaining files.';
      errorBox.hidden=false;
    }
  }finally{setUploadBusy(false);}
}
function readMarkdownMode(){try{return localStorage.getItem('sandbox.files.markdown-mode')==='raw'?'raw':'rendered';}catch{return 'rendered';}}
function writeMarkdownMode(mode){try{localStorage.setItem('sandbox.files.markdown-mode',mode);}catch{}}
function markdownHeadingSlug(text){return text.normalize('NFKC').trim().toLowerCase().replace(/[^\p{L}\p{N}_\s-]/gu,'').replace(/\s+/g,'-')||'section';}
function markdownAnchor(hash){if(!hash)return '';try{return '#markdown-'+markdownHeadingSlug(decodeURIComponent(hash.replace(/^#/,'')));}catch{return '';}}
function markdownDestination(href,path){
  const value=String(href||'').trim();
  if(!value||/[\u0000-\u001f\u007f\\]/.test(value)||value.startsWith('//'))return null;
  if(value.startsWith('#'))return {href:markdownAnchor(value)};
  const scheme=value.match(/^([a-z][a-z0-9+.-]*):/i);
  if(scheme&&!/^https?$/i.test(scheme[1]))return null;
  try{
    const base=location.origin+'/'+normalize(path).slice(1).split('/').map(encodeURIComponent).join('/');
    const url=new URL(value,base);
    if(!/^https?:$/.test(url.protocol))return null;
    if(scheme&&url.origin!==location.origin)return {href:url.href,external:true};
    let destination=decodeURIComponent(url.pathname);
    if(scheme&&destination.startsWith(BASE+'/browse/'))destination=destination.slice((BASE+'/browse').length);
    destination=normalize(destination);
    const hash=markdownAnchor(url.hash);
    return {href:route(destination)+hash,path:destination,hash};
  }catch{return null;}
}
let markdownRenderer;
function renderMarkdown(text,path){
  if(!markdownRenderer){
    if(typeof window.markdownit!=='function')throw new Error('Markdown renderer unavailable');
    const md=window.markdownit({html:false,linkify:false,typographer:false});
    md.core.ruler.push('sandbox_heading_ids',state=>{
      const used=new Set();
      for(let i=0;i<state.tokens.length;i++){
        if(state.tokens[i].type!=='heading_open')continue;
        const inline=state.tokens[i+1];
        const label=(inline.children||[]).map(token=>token.type==='softbreak'||token.type==='hardbreak'?' ':token.type==='text'||token.type==='code_inline'||token.type==='image'?token.content:'').join('');
        const slug=markdownHeadingSlug(label);let id='markdown-'+slug,count=0;
        while(used.has(id))id='markdown-'+slug+'-'+(++count);
        used.add(id);state.tokens[i].attrSet('id',id);
      }
    });
    md.renderer.rules.link_open=(tokens,index,options,env,self)=>{
      const token=tokens[index],destination=markdownDestination(token.attrGet('href'),env.path);
      (env.linkTags||(env.linkTags=[])).push(destination?'a':'span');
      if(!destination)return '<span class="markdown-link-disabled">';
      token.attrSet('href',destination.href);
      if(destination.external){token.attrSet('target','_blank');token.attrSet('rel','noopener noreferrer');}
      if(destination.path){token.attrSet('data-path',destination.path);token.attrSet('data-hash',destination.hash||'');}
      return self.renderToken(tokens,index,options);
    };
    md.renderer.rules.link_close=(tokens,index,options,env)=>'</'+env.linkTags.pop()+'>';
    md.renderer.rules.image=(tokens,index)=>'<span class="markdown-image">'+md.utils.escapeHtml('Image: '+(tokens[index].content||'Untitled image'))+' <small>not loaded</small></span>';
    markdownRenderer=md;
  }
  return markdownRenderer.render(text,{path});
}
function scrollToMarkdownAnchor(hash=location.hash){
  if(!hash)return;
  let id;try{id=decodeURIComponent(hash.slice(1));}catch{return;}
  if(!id.startsWith('markdown-'))return;
  const target=document.getElementById(id);
  if(target&&target.closest('.markdown-preview'))target.scrollIntoView({block:'start'});
}
async function renderFile(path,info,version){

  const content=$('content'),header=heading(path,size(result.size)+' · Modified '+date(result.mtime)),actions=element('div','actions'),copy=element('button','button primary');
  copy.type='button';copy.append(icon('copy'),document.createTextNode('Copy contents'));copy.disabled=!result.copyable;copy.title=result.binary?'Binary files cannot be copied as text':!result.copyable?'Copy supports text files up to 2 MB':'Copy the complete file contents';copy.addEventListener('click',()=>copyContents(path,copy));actions.append(copy,downloadButton(path));header.append(actions);content.replaceChildren(header);

    if(result.truncated)content.append(element('div','notice warning','Preview limited to the first 256 KB. Download for the full file'+(result.copyable?', or use Copy contents.':'.')));

      rendered.type=raw.type='button';rendered.setAttribute('aria-controls','rendered-preview');raw.setAttribute('aria-controls','raw-preview');
      try{article.innerHTML=renderMarkdown(text,path);if(!text)article.append(element('p','markdown-empty','This Markdown file is empty.'));}
      catch{mode='raw';rendered.disabled=true;rendered.title='Markdown renderer is unavailable. Refresh to retry.';content.append(element('div','notice warning','Markdown rendering is unavailable. Showing the raw file.'));}
      function setMode(value,remember=false){mode=value;article.hidden=mode!=='rendered';pre.hidden=mode!=='raw';rendered.setAttribute('aria-pressed',String(mode==='rendered'));raw.setAttribute('aria-pressed',String(mode==='raw'));if(remember)writeMarkdownMode(mode);if(mode==='rendered')scrollToMarkdownAnchor();}
      rendered.addEventListener('click',()=>setMode('rendered',true));raw.addEventListener('click',()=>setMode('raw',true));modes.append(rendered,raw);toolbar.append(label,modes);content.append(toolbar,article,pre);setMode(mode);

async function navigate(path,options={}){path=normalize(path);const version=++generation;activePath=path;activeDirectory=null;updateUploadAvailability();const destination=route(path)+(options.hash||'');if(options.history!==false&&location.pathname+location.hash!==destination)history.pushState({},'',destination);document.title=basename(path)+' · Files';breadcrumbs(path);$('footer-path').textContent=path;$('footer-status').textContent='Loading…';$('up').disabled=path==='/';$('content').setAttribute('aria-busy','true');const loading=element('div','empty');loading.append(element('div','spinner'),element('span','','Loading…'));$('content').replaceChildren(loading);highlightTree();sidebar(false);try{const info=await api('stat',path);if(version!==generation)return;activeDirectory=info.kind==='directory'?path:info.kind==='file'?parent(path):null;updateUploadAvailability();if(info.kind==='directory')await renderDirectory(path,info,version);else if(info.kind==='file')await renderFile(path,info,version);else{$('content').replaceChildren(heading(path,path),emptyState('Special filesystem entry','This entry can be inspected in a terminal. File previews are available for regular files.','file'));$('footer-status').textContent='Special file';}}catch(error){if(version!==generation)return;activeDirectory=null;updateUploadAvailability();const state=emptyState('Unable to open this path',error.message,'error'),actions=element('div','actions'),retry=element('button','','Try again'),up=link(parent(path),'Go to parent folder','button');retry.type='button';retry.addEventListener('click',()=>navigate(path,{history:false}));actions.append(retry,up);state.append(actions);$('content').replaceChildren(heading(path,path),state);$('footer-status').textContent='Unavailable';}finally{if(version===generation){$('content').setAttribute('aria-busy','false');scrollToMarkdownAnchor();}}}
$('brand-icon').append(icon('folder'));$('upload-open').replaceChildren(icon('upload'),document.createTextNode('Upload files'));$('menu-toggle').append(icon('menu'));$('up').append(icon('up'));$('refresh').append(icon('refresh'));

$('upload-open').addEventListener('click',openUpload);$('upload-file').addEventListener('change',uploadFileChanged);$('upload-downloads').addEventListener('change',updateUploadDestination);$('upload-form').addEventListener('submit',submitUpload);$('upload-cancel').addEventListener('click',closeUpload);$('upload-dialog').addEventListener('cancel',event=>{event.preventDefault();if(!uploadBusy)closeUpload();});$('upload-dialog').addEventListener('close',()=>$('upload-open').focus());
document.addEventListener('click',event=>{const a=event.target.closest('a[data-path]');if(!a||event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;event.preventDefault();navigate(a.dataset.path,{hash:a.dataset.hash||''});});
